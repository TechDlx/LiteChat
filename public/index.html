<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Temporary, disposable chat rooms. No accounts, no history beyond the room.">
<title>LiteChat</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E">
</head>
<body>

<!-- ---------- Landing ---------- -->
<main id="landing" class="landing">
  <div class="card">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <h1>LiteChat</h1>
    </div>
    <p class="tagline">Temporary rooms. No sign-up. Gone after 30 quiet days.</p>

    <button id="createBtn" class="btn btn-primary">Create a room</button>

    <div class="divider"><span>or join with a code</span></div>

    <form id="joinForm" autocomplete="off">
      <div class="code-input" id="codeBoxes">
        <input class="code-box" inputmode="text" maxlength="1" aria-label="Code character 1">
        <input class="code-box" inputmode="text" maxlength="1" aria-label="Code character 2">
        <input class="code-box" inputmode="text" maxlength="1" aria-label="Code character 3">
        <input class="code-box" inputmode="text" maxlength="1" aria-label="Code character 4">
      </div>
      <button id="joinBtn" class="btn" type="submit" disabled>Join room</button>
    </form>

    <p id="landingError" class="error" role="alert" hidden></p>
  </div>
  <p class="footnote">Messages live in the room, not on your device. Anyone with the code can read them.</p>
</main>

<!-- ---------- Room ---------- -->
<div id="room" class="room" hidden>
  <header class="room-header">
    <button id="leaveBtn" class="icon-btn" title="Leave room" aria-label="Leave room">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button id="codeChip" class="code-chip" title="Copy invite link">
      <span id="roomCode">····</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
    </button>
    <div class="room-meta">
      <span class="presence"><span class="pulse" aria-hidden="true"></span><span id="onlineCount">0</span> online</span>
      <span id="youAre" class="you-are"></span>
    </div>
  </header>

  <div id="messages" class="messages" role="log" aria-live="polite">
    <div id="emptyState" class="empty">
      <p>Nothing here yet.</p>
      <p class="muted">Share the code above to bring someone in.</p>
    </div>
  </div>

  <div id="typing" class="typing" aria-live="polite"></div>

  <form id="composer" class="composer" autocomplete="off">
    <textarea id="input" rows="1" placeholder="Message…" maxlength="2000" aria-label="Message"></textarea>
    <button id="sendBtn" class="send" type="submit" aria-label="Send" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 8 6 8z"/></svg>
    </button>
  </form>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/app.js" type="module"></script>
</body>
</html>
